name: Deploy to Jino

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Internal design-system comparison page — a review tool, not part of the real site, so it's
      # never shipped to the live domain.
      - name: Remove internal dev-only route
        run: rm -rf "app/(dev)"

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://pick-a-lock.ru
          NEXT_PUBLIC_YANDEX_METRIKA_ID: ${{ secrets.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      # SFTP (port 2222) needs Jino's paid "Поддержка SSH" add-on, which isn't enabled — every
      # attempt timed out with nothing listening. Back to plain FTP: the original attempt failed
      # with "AggregateError (control socket)", but that was against the hostname, which resolves
      # to both an IPv6 and IPv4 address — the same dual-stack issue that broke SFTP until
      # FTP_SERVER was switched to the IPv4 literal. Worth a clean retry now that it's fixed.
      - name: Deploy over FTP to Jino
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          # zamkisochi_pickalock's own home folder is already /domains/pick-a-lock.ru — no
          # subpath needed.
          server-dir: ./
          # lead-config.php holds the Telegram bot secrets and is uploaded manually, once, over
          # FTP — it must never be touched by this workflow (it isn't in the repo to begin with,
          # but this is a second line of defense).
          exclude: |
            **/.git*
            **/lead-config.php

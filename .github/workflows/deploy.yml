name: Deploy to Jino

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Internal design-system comparison page only — hits an unrelated Turbopack production-build
      # bug resolving next/font/google. Never shipped; dropped before build rather than fixed.
      - name: Remove internal dev-only route
        run: rm -rf "app/(dev)"

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://pick-a-lock.ru
          NEXT_PUBLIC_YANDEX_METRIKA_ID: ${{ secrets.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      # Plain FTP and explicit FTPS both failed at the connection level (AggregateError on the
      # control socket, then a hang on FTPS) — switched to SFTP on port 2222, which Jino's panel
      # also lists as supported. sftp_only forces pure SFTP file transfer instead of this action's
      # default rsync-over-ssh mode, which needs an rsync binary on the remote that shared hosting
      # like this generally doesn't have.
      - name: Deploy over SFTP to Jino
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 2222
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp_only: true
          local_path: "./out/*"
          # Relative to the account's own root (shown as "/" in Jino's FTP panel), which is the
          # same root the "Домашняя папка" column in Jino's domain list is shown from.
          remote_path: "./domains/pick-a-lock.ru/"

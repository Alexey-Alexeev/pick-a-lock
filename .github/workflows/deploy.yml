name: Deploy to Jino

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Internal design-system comparison page — a review tool, not part of the real site, so it's
      # never shipped to the live domain.
      - name: Remove internal dev-only route
        run: rm -rf "app/(dev)"

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://pick-a-lock.ru
          NEXT_PUBLIC_YANDEX_METRIKA_ID: ${{ secrets.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      # Plain FTP does connect, but the site is ~900 files/folders (70 cities × ~12 services) and
      # FTP uploads one at a time over a single connection — it was still running past the
      # 10-minute job timeout. Instead: zip the build, upload that ONE file, then ask a small PHP
      # script already on the server to extract it in place. See public/deploy-unzip.php and
      # public/deploy-config.example.php for the one-time manual bootstrap this needs.
      - name: Package static export
        run: |
          cd out
          zip -rq ../site.zip .
          cd ..
          du -h site.zip

      - name: Upload site.zip over FTP
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 30 --max-time 900 --retry 2 --retry-delay 10 \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -T site.zip \
            "ftp://${{ secrets.FTP_SERVER }}/site.zip"

      - name: Trigger server-side extraction
        run: |
          curl --fail --silent --show-error --max-time 300 \
            "https://pick-a-lock.ru/deploy-unzip.php?token=${{ secrets.DEPLOY_TOKEN }}"
